<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Termux Web UI</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style type="text/css">
    body { background-color: #131314; color: #e3e3e3; font-family: 'Google Sans', 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333537; border-radius: 9999px; }
    .gemini-gradient-text {
      background: linear-gradient(90deg, #4285f4 0%, #9b72cb 50%, #d96570 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .bg-gemini-bg { background-color: #131314; }
    .bg-gemini-card, .bg-gemini-input { background-color: #1e1f20; }
    .bg-gemini-hover { background-color: #28292a; }
    .border-gemini-border { border-color: #333537; }
    .text-gemini-accent { color: #a8c7fa; }
    .bg-gemini-accent { background-color: #a8c7fa; }

    /* ===== Gemini-style skin (CSS only, JS untouched) ===== */
    #chat-form { transition: background-color .2s; }
    #chat-form:focus-within { background-color: #282a2c; }

    .chip { text-align: left; background: #1e1f20; border-radius: 16px; padding: 14px;
      min-height: 112px; display: flex; flex-direction: column; justify-content: space-between;
      font-size: .875rem; line-height: 1.4; color: #e3e3e3; transition: background-color .15s; }
    .chip:hover { background: #28292a; }
    .chip svg { align-self: flex-end; color: #a8c7fa; }

    /* Restyle messages generated by the script */
    #messages-list > .justify-end > div { background: #282a2c; border: 0; border-radius: 24px; padding: .75rem 1.15rem; font-size: .95rem; }
    #messages-list > .justify-start > div:first-child { background: transparent; border: 0; }
    #messages-list .rounded-tl-none { background: transparent; border: 0; padding: .25rem 0; font-size: .95rem; line-height: 1.75; }
    #messages-list .animate-pulse { background: transparent; border: 0; padding-left: 0; }
    #messages-list [id^="term-"] { overflow-y: auto; }
    #messages-list .bg-black { background: #0e0e0f; border-radius: 16px; }
  </style>
</head>
<body class="h-dvh flex flex-col font-sans overflow-hidden antialiased select-none bg-gemini-bg text-gray-200">

  <!-- Header -->
  <header class="h-16 bg-gemini-bg flex items-center justify-between px-4 sm:px-6 z-20 shrink-0">
    <h1 class="flex items-center gap-2.5">
      <span class="gemini-gradient-text text-xl font-medium tracking-tight whitespace-nowrap">Gemini Termux</span>
      <span class="text-xs px-2.5 py-0.5 rounded-full bg-gemini-card text-gemini-accent font-mono font-normal whitespace-nowrap">Web CLI</span>
    </h1>

    <div class="flex items-center gap-3">
      <!-- Settings Button -->
      <button id="open-settings-btn" type="button" class="flex items-center gap-2 pl-3 pr-4 py-2 rounded-full bg-gemini-card hover:bg-gemini-hover text-gray-200 text-sm transition-all active:scale-95" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Settings</span>
      </button>
    </div>
  </header>

  <!-- Main Chat -->
  <main id="chat-container" class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6 max-w-3xl w-full mx-auto pb-40">
    <div id="welcome-screen" class="h-full flex flex-col items-start justify-center py-12 space-y-8">
      <div class="space-y-3">
        <h2 class="text-4xl sm:text-5xl font-medium tracking-tight leading-tight">
          <span class="gemini-gradient-text">Hello!</span><br>
          <span class="text-gray-500">How can I help in Termux?</span>
        </h2>
        <p class="text-sm text-gray-400">
          Configure API Key and Model Name in Settings, then start prompting.
        </p>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full">
        <button type="button" class="chip" data-p="Show my storage usage" onclick="var p=document.getElementById('prompt-input');p.value=this.dataset.p;p.focus()">
          <span>Show my storage usage</span><i data-lucide="hard-drive" class="w-5 h-5"></i>
        </button>
        <button type="button" class="chip" data-p="List all files in the current folder" onclick="var p=document.getElementById('prompt-input');p.value=this.dataset.p;p.focus()">
          <span>List all files in the current folder</span><i data-lucide="folder" class="w-5 h-5"></i>
        </button>
        <button type="button" class="chip" data-p="Update all installed packages" onclick="var p=document.getElementById('prompt-input');p.value=this.dataset.p;p.focus()">
          <span>Update all installed packages</span><i data-lucide="package" class="w-5 h-5"></i>
        </button>
        <button type="button" class="chip" data-p="Explain how grep works" onclick="var p=document.getElementById('prompt-input');p.value=this.dataset.p;p.focus()">
          <span>Explain how grep works</span><i data-lucide="book-open" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <div id="messages-list" class="space-y-6"></div>
  </main>

  <!-- Input Bar -->
  <div class="fixed bottom-0 left-0 right-0 px-4 pt-4 pb-3 sm:px-6 bg-gradient-to-t from-gemini-bg via-gemini-bg/95 to-transparent z-10">
    <div class="max-w-3xl mx-auto">
      <form id="chat-form" class="relative flex items-center bg-gemini-input rounded-[28px] p-2 pr-3">
        <textarea 
          id="prompt-input" 
          rows="1" 
          placeholder="Ask or command Gemini Termux..." 
          class="w-full bg-transparent text-base text-gray-100 placeholder-gray-500 px-4 py-2.5 focus:outline-none resize-none max-h-32 font-sans"
          onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); this.form.dispatchEvent(new Event('submit', {cancelable: true, bubbles: true})); }"
        ></textarea>

        <button 
          type="submit" 
          id="send-btn" 
          class="p-2.5 rounded-full bg-gemini-accent text-gray-950 hover:bg-opacity-90 active:scale-95 transition-all disabled:opacity-40 shrink-0"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
        </button>
      </form>
      <p class="text-center text-[11px] text-gray-500 mt-2">AI can make mistakes, so double-check the commands it runs.</p>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
    <div class="bg-gemini-card rounded-[28px] max-w-md w-full p-6 space-y-6 shadow-2xl transform scale-95 transition-transform duration-200" id="settings-content">
      
      <div class="flex items-start justify-between gap-4">
        <div>
          <h3 class="font-medium text-lg">Gemini Settings</h3>
          <p class="text-xs text-gray-400 mt-0.5">Set your API key and model name.</p>
        </div>
      </div>

      <div class="space-y-4 text-sm">
        <div class="space-y-1.5">
          <label class="block text-xs font-medium text-gray-300">Gemini API Key</label>
          <p class="text-[11px] text-gray-500">Saved in this browser only.</p>
          <input 
            type="password" 
            id="api-key-input" 
            placeholder="Enter API Key here..." 
            class="w-full bg-gemini-bg border border-gemini-border rounded-2xl px-4 py-3 text-xs text-gray-100 focus:outline-none focus:border-gemini-accent font-mono"
          />
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-medium text-gray-300">Model Name</label>
          <p class="text-[11px] text-gray-500">Example: gemini-2.5-flash</p>
          <input 
            type="text" 
            id="model-input" 
            placeholder="e.g., gemini-2.5-flash or gemini-2.5-pro" 
            class="w-full bg-gemini-bg border border-gemini-border rounded-2xl px-4 py-3 text-xs text-gray-100 focus:outline-none focus:border-gemini-accent font-mono"
          />
        </div>
      </div>

      <div class="flex items-center justify-end gap-2">
        <button id="close-settings-btn" type="button" class="px-5 py-2.5 rounded-full bg-gemini-hover text-gray-200 text-sm hover:opacity-90 transition-all">Close</button>
        <button id="save-settings-btn" class="px-6 py-2.5 rounded-full bg-gemini-accent text-gray-950 font-medium text-sm hover:bg-opacity-90 transition-all">
          Save Settings
        </button>
      </div>
    </div>
  </div>

  <script>
    let socket = null;
    let config = {
      apiKey: localStorage.getItem('gemini_api_key') || '',
      model: localStorage.getItem('gemini_model') || ''
    };

    const chatContainer = document.getElementById('chat-container');
    const messagesList = document.getElementById('messages-list');
    const welcomeScreen = document.getElementById('welcome-screen');
    const chatForm = document.getElementById('chat-form');
    const promptInput = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');

    const settingsModal = document.getElementById('settings-modal');
    const settingsContent = document.getElementById('settings-content');
    const openSettingsBtn = document.getElementById('open-settings-btn');
    const closeSettingsBtn = document.getElementById('close-settings-btn');
    const saveSettingsBtn = document.getElementById('save-settings-btn');
    const apiKeyInput = document.getElementById('api-key-input');
    const modelInput = document.getElementById('model-input');

    if (window.lucide) {
      lucide.createIcons();
    }

    apiKeyInput.value = config.apiKey;
    modelInput.value = config.model;

    if (!config.apiKey || !config.model) setTimeout(() => openModal(), 300);

    function initSocket() {
      try {
        socket = io(window.location.origin);
      } catch (e) {}
    }
    initSocket();

    function openModal() {
      settingsModal.classList.remove('hidden');
      setTimeout(() => {
        settingsModal.classList.remove('opacity-0');
        settingsContent.classList.remove('scale-95');
      }, 10);
    }

    function closeModal() {
      settingsModal.classList.add('opacity-0');
      settingsContent.classList.add('scale-95');
      setTimeout(() => settingsModal.classList.add('hidden'), 200);
    }

    openSettingsBtn.addEventListener('click', openModal);
    closeSettingsBtn.addEventListener('click', closeModal);

    saveSettingsBtn.addEventListener('click', () => {
      config.apiKey = apiKeyInput.value.trim();
      config.model = modelInput.value.trim();
      
      localStorage.setItem('gemini_api_key', config.apiKey);
      localStorage.setItem('gemini_model', config.model);

      closeModal();
    });

    async function callGeminiAPI(userPrompt) {
      if (!config.apiKey || !config.model) {
        openModal();
        throw new Error('Please configure Gemini API Key and Model Name in Settings.');
      }

      const systemInstruction = `You are a Termux CLI assistant.
Check user request intent:
- If user wants to execute shell commands or inspect Termux, set intent: "COMMAND".
- If user asks general questions or talks casually, set intent: "CHAT".

Return pure JSON only:
{
  "intent": "COMMAND" or "CHAT",
  "explanation": "Response explaining answer or command action",
  "command": "Raw bash command (if intent is COMMAND, otherwise null)"
}`;

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${config.model}:generateContent?key=${config.apiKey}`;

      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: userPrompt }] }],
          systemInstruction: { parts: [{ text: systemInstruction }] },
          generationConfig: { responseMimeType: 'application/json' }
        })
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error?.message || 'Failed to connect to Gemini API. Check API Key or Model Name.');
      }

      const result = await response.json();
      const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text;
      
      try {
        return JSON.parse(rawText);
      } catch (err) {
        return { intent: "CHAT", explanation: rawText, command: null };
      }
    }

    function appendUserMessage(text) {
      if (welcomeScreen) welcomeScreen.remove();
      const msgDiv = document.createElement('div');
      msgDiv.className = 'flex justify-end gap-3';
      msgDiv.innerHTML = `
        <div class="bg-gemini-hover border border-gemini-border rounded-2xl rounded-tr-none px-4 py-3 max-w-[85%] text-sm text-gray-100">
          <p class="whitespace-pre-wrap">${escapeHtml(text)}</p>
        </div>
      `;
      messagesList.appendChild(msgDiv);
      scrollToBottom();
    }

    function appendAIMessageContainer() {
      if (welcomeScreen) welcomeScreen.remove();
      const id = 'msg-' + Date.now();
      const msgDiv = document.createElement('div');
      msgDiv.className = 'flex justify-start gap-3';
      msgDiv.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-gemini-card border border-gemini-border flex items-center justify-center text-gemini-accent shrink-0 mt-1">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
        </div>
        <div id="${id}" class="space-y-3 max-w-[85%]">
          <div class="flex items-center gap-2 text-xs text-gray-400 bg-gemini-card px-4 py-3 rounded-2xl border border-gemini-border animate-pulse">
            <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-gemini-accent"></i>
            <span>Gemini is processing...</span>
          </div>
        </div>
      `;
      messagesList.appendChild(msgDiv);
      if (window.lucide) lucide.createIcons();
      scrollToBottom();
      return id;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = promptInput.value.trim();
      if (!prompt) return;

      promptInput.value = '';
      sendBtn.disabled = true;

      appendUserMessage(prompt);
      const aiContainerId = appendAIMessageContainer();
      const aiContainer = document.getElementById(aiContainerId);

      try {
        const result = await callGeminiAPI(prompt);

        aiContainer.innerHTML = `
          <div class="bg-gemini-card border border-gemini-border rounded-2xl rounded-tl-none p-4 text-sm text-gray-200 space-y-2">
            <div class="text-xs font-semibold ${result.intent === 'COMMAND' ? 'text-amber-400' : 'text-gemini-accent'} flex items-center gap-1.5">
              <i data-lucide="${result.intent === 'COMMAND' ? 'terminal' : 'message-square'}" class="w-4 h-4"></i>
              <span>${result.intent === 'COMMAND' ? 'Execute Termux Command' : 'Gemini Response'}</span>
            </div>
            <p class="whitespace-pre-wrap">${escapeHtml(result.explanation)}</p>
          </div>
        `;

        if (result.intent === 'COMMAND' && result.command) {
          const termId = 'term-' + Date.now();
          const terminalBlock = document.createElement('div');
          terminalBlock.className = 'bg-black border border-gemini-border rounded-2xl p-3 font-mono text-xs text-gray-300 space-y-2';
          terminalBlock.innerHTML = `
            <div class="flex items-center justify-between border-b border-gray-800 pb-2 text-[11px] text-gray-400">
              <span class="text-emerald-400">Termux Output</span>
              <span class="bg-gray-900 px-2 py-0.5 rounded">${escapeHtml(result.command)}</span>
            </div>
            <div id="${termId}" class="p-2 overflow-x-auto max-h-48 text-emerald-400 whitespace-pre-wrap font-mono">
              > Executing in Termux...\n
            </div>
          `;
          aiContainer.appendChild(terminalBlock);

          if (socket && socket.connected) {
            socket.emit('run_command', result.command);
            socket.once('cmd_result', (data) => {
              const termBox = document.getElementById(termId);
              if (termBox) {
                termBox.innerText += data.error ? `\n[ERROR]: ${data.error}` : `\n${data.stdout || data.stderr || '[Done]'}`;
                scrollToBottom();
              }
            });
          }
        }
      } catch (err) {
        aiContainer.innerHTML = `<div class="bg-red-950/40 border border-red-800/60 rounded-2xl p-4 text-xs text-red-300">${escapeHtml(err.message)}</div>`;
      } finally {
        sendBtn.disabled = false;
        if (window.lucide) lucide.createIcons();
        scrollToBottom();
      }
    });

    function scrollToBottom() {
      chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
    }

    function escapeHtml(text) {
      return (text || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>

  <!-- Auto-scroll: terminal output box follows the newest output (separate from the main script) -->
  <script id="term-autoscroll">
    (function () {
      var list = document.getElementById('messages-list');
      if (!list || !window.MutationObserver) return;
      new MutationObserver(function (records) {
        records.forEach(function (r) {
          var el = r.target.nodeType === 1 ? r.target : r.target.parentElement;
          var term = el && el.closest ? el.closest('[id^="term-"]') : null;
          if (term) term.scrollTop = term.scrollHeight;
        });
      }).observe(list, { childList: true, characterData: true, subtree: true });
    })();
  </script>
</body>
</html>
